server {

	listen 80 default_server;
    server_name projetoz.local arkz.dev.br www.arkz.dev.br;

    client_max_body_size 10m;

# Necessário para o Let's Encrypt validar o domínio antes de emitirmos o
# certificado HTTPS (certbot escreve arquivos aqui via --webroot).
location /.well-known/acme-challenge/ {
    root /var/www/certbot;
}

location /signin-steam {
    proxy_pass http://api:8080;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /signin-google {
    proxy_pass http://api:8080;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location / {
        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

location /api/ {
    proxy_pass http://api:8080;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
}
}