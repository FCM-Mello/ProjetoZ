services:
  postgres:
    image: postgres:17
    container_name: projetoz-postgres
    restart: always

    environment:
      POSTGRES_DB: projetoz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: ProjetoZ.Api/Dockerfile

    container_name: projetoz-api

    depends_on:
      - postgres

    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=projetoz;Username=postgres;Password=postgres
      MercadoPago__AccessToken: ${MERCADOPAGO_ACCESS_TOKEN}
      MercadoPago__WebhookSecret: ${MERCADOPAGO_WEBHOOK_SECRET}
      MercadoPago__PublicKey: ${MERCADOPAGO_PUBLIC_KEY}
      App__FrontendUrl: ${APP_FRONTEND_URL}
      App__BackendUrl: ${APP_BACKEND_URL}
      GameServer__ApiKey: ${GAMESERVER_API_KEY}
      Google__ClientId: ${GOOGLE_CLIENT_ID}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      Google__YoutubeApiKey: ${GOOGLE_YOUTUBE_API_KEY}

    ports:
      - "127.0.0.1:5000:8080"

  frontend:
    build:
      context: ./frontend

    container_name: projetoz-frontend

    depends_on:
      - api

    ports:
      - "127.0.0.1:3000:3000"

  nginx:
    image: nginx:latest

    container_name: projetoz-nginx

    restart: always

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt

    depends_on:
      - frontend
      - api

volumes:
  postgres-data:
  certbot-webroot:
  certbot-certs: