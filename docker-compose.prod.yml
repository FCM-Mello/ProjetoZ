services:
  nginx:
    volumes:
      - ./nginx/default-ssl.conf:/etc/nginx/conf.d/default.conf
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt

  certbot:
    image: certbot/certbot
    container_name: projetoz-certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
